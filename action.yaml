name: "Database Migrations"
description: "Make database migrations using flyway through a bastion (SSM Session Manager or SSH tunnel) for PostgreSQL"
inputs:
  flyway_version:
    description: "Flyway version"
    required: false
    default: '8.5.11'
  aws_role_arn:
    description: >-
      IAM role to assume with GitHub OIDC. When set, the DB is reached with an
      SSM Session Manager port forward through the bastion (no SSH). The calling
      workflow needs `permissions: id-token: write`.
    required: false
    default: ''
  aws_region:
    description: AWS region of the bastion (SSM mode)
    required: false
    default: 'us-east-1'
  bastion_name:
    description: Value of the bastion's Name tag (SSM mode)
    required: false
    default: ''
  ssh_key:
    description: ssh key (SSH mode, used when aws_role_arn is empty)
    required: false
    default: ''
  ssh_host:
    description: ssh host (SSH mode)
    required: false
    default: ''
  ssh_user:
    description: ssh username (SSH mode)
    required: false
    default: ''
  db_host:
    description: database host
    required: true
  db_user:
    description: database user
    required: true
  db_password:
    description: database password
    required: true
  db_port:
    description: database port
    required: false
    default: '5432'
  db_name:
    description: database name
    required: true
  migrations_folder_path:
    description: Path from repository root to the database migrations folder
    required: false
    default: 'db/migrations'
  flyway_config_path:
    description: Path from repository root folder to the flyway config file
    required: false
    default: 'db/conf/flyway.conf'
  flyway_extra_params:
    description: Add extra params to Flyway command. By defaults, it adds -outOfOrder=true
    required: false
    default: '-outOfOrder=true -ignoreMigrationPatterns=*:missing'
  flyway_command:
    description: 'Command to run. Ej: migrate, repair'
    required: false
    default: 'migrate'
runs:
  using: "composite"
  steps:
    - name: Cache Flyway binary
      uses: actions/cache@v3
      with:
        path: flyway-${{inputs.flyway_version}}
        key: flyway-${{inputs.flyway_version}}-linux-x64

    - name: Install Flyway (if not cached)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FLYWAY_VERSION: ${{inputs.flyway_version}}
      run: wget -qO- https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/$FLYWAY_VERSION/flyway-commandline-$FLYWAY_VERSION-linux-x64.tar.gz | tar xvz

    - name: Configure Flyway
      shell: bash
      env:
        FLYWAY_VERSION: ${{inputs.flyway_version}}
      run: sudo ln -s `pwd`/flyway-$FLYWAY_VERSION/flyway /usr/local/bin

    - name: Check connection inputs
      shell: bash
      env:
        AWS_ROLE_ARN: ${{inputs.aws_role_arn}}
        BASTION_NAME: ${{inputs.bastion_name}}
        SSH_HOST: ${{inputs.ssh_host}}
        SSH_KEY: ${{inputs.ssh_key}}
        SSH_USER: ${{inputs.ssh_user}}
      run: |
        if [ -n "$AWS_ROLE_ARN" ]; then
          if [ -z "$BASTION_NAME" ]; then
            echo "::error::bastion_name is required when aws_role_arn is set"
            exit 1
          fi
        elif [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_USER" ]; then
          echo "::error::Set aws_role_arn + bastion_name (SSM) or ssh_host + ssh_user + ssh_key (SSH)"
          exit 1
        fi

    # --- SSM mode -------------------------------------------------------------
    - name: Configure AWS credentials (OIDC)
      if: inputs.aws_role_arn != ''
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{inputs.aws_role_arn}}
        aws-region: ${{inputs.aws_region}}
        role-session-name: flyway-${{github.run_id}}-${{github.run_attempt}}

    - name: SSM port forwarding to the database
      if: inputs.aws_role_arn != ''
      shell: bash
      env:
        BASTION_NAME: ${{inputs.bastion_name}}
        DB_HOST: ${{inputs.db_host}}
        DB_PORT: ${{inputs.db_port}}
      run: |
        set -euo pipefail

        if ! command -v session-manager-plugin >/dev/null 2>&1; then
          curl -fsSL -o "$RUNNER_TEMP/session-manager-plugin.deb" \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
        fi

        # Resolved by tag: the instance ID changes when the bastion is replaced.
        INSTANCE_IDS=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=$BASTION_NAME" "Name=instance-state-name,Values=running" \
          --query 'Reservations[].Instances[].InstanceId' --output text)
        read -r -a IDS <<< "$INSTANCE_IDS"
        if [ "${#IDS[@]}" -ne 1 ]; then
          echo "::error::Expected exactly one running instance tagged Name=$BASTION_NAME, found ${#IDS[@]}"
          exit 1
        fi

        PARAMS=$(jq -nc --arg host "$DB_HOST" --arg port "$DB_PORT" \
          '{host: [$host], portNumber: [$port], localPortNumber: ["5432"]}')

        # Runs in the background for the rest of the job (like `ssh -f`); the
        # runner kills it during job cleanup.
        setsid nohup aws ssm start-session \
          --target "${IDS[0]}" \
          --document-name AWS-StartPortForwardingSessionToRemoteHost \
          --parameters "$PARAMS" \
          > "$RUNNER_TEMP/ssm-session.log" 2>&1 < /dev/null &

        for _ in $(seq 1 30); do
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
            echo "SSM port forward ready on localhost:5432"
            exit 0
          fi
          sleep 1
        done
        echo "::error::SSM port forward did not come up in 30s"
        cat "$RUNNER_TEMP/ssm-session.log"
        exit 1

    # --- SSH mode (legacy) ----------------------------------------------------
    - name: Configure SSH
      if: inputs.aws_role_arn == ''
      shell: bash
      env:
        SSH_HOST: ${{inputs.ssh_host}}
        SSH_KEY: ${{inputs.ssh_key}}
      run: |
        mkdir -p ~/.ssh
        touch ~/.ssh/known_hosts
        touch ~/.ssh/ssh_key.pem
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
        eval `ssh-agent -s`
        ssh-add - <<< "$SSH_KEY"
        echo "$SSH_KEY" >> ~/.ssh/ssh_key.pem
        chmod  400 ~/.ssh/ssh_key.pem

    - name: SSH connection
      if: inputs.aws_role_arn == ''
      shell: bash
      env:
        DB_HOST: ${{inputs.db_host}}
        DB_PORT: ${{inputs.db_port}}
        SSH_USER: ${{inputs.ssh_user}}
        SSH_HOST: ${{inputs.ssh_host}}
      run: |
        ssh -o ExitOnForwardFailure=yes -f -N -L 5432:$DB_HOST:$DB_PORT \
          $SSH_USER@$SSH_HOST -i ~/.ssh/ssh_key.pem

    - name: Make migrations
      shell: bash
      env:
        FLYWAY_COMMAND: ${{inputs.flyway_command}}
        DB_NAME: ${{inputs.db_name}}
        FLYWAY_EXTRA_PARAMS: ${{inputs.flyway_extra_params}}
        DB_USER: ${{inputs.db_user}}
        DB_PASSWORD: ${{inputs.db_password}}
        MIGRATIONS_FOLDER_PATH: ${{inputs.migrations_folder_path}}
        FLYWAY_CONFIG_PATH: ${{inputs.flyway_config_path}}
      run: |
        flyway $FLYWAY_COMMAND -url=jdbc:postgresql://localhost:5432/$DB_NAME $FLYWAY_EXTRA_PARAMS \
          -user=$DB_USER \
          -password=$DB_PASSWORD \
          -locations=$MIGRATIONS_FOLDER_PATH \
          -configFiles=$FLYWAY_CONFIG_PATH
